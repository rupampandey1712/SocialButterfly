services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Change_this_password_123!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    restart: unless-stopped
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Change_this_password_123!}
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 5
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./infra/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      - sqlserver

  app:
    image: ${SOCIALMEDIA_IMAGE:-ramp1712/socialmediaweb:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Con: Server=sqlserver,1433;Database=SocialMedia;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Change_this_password_123!};TrustServerCertificate=True;Encrypt=False;
      ConnectionStrings__blobs: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2lRcuQYhQv4o9VpxYlRvxK5Y6uR4oTHC9S0N2S/0EDYw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      ConnectionStrings__servicebus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Database__ApplyMigrations: "true"
      JWT__ValidAudience: ${JWT_VALID_AUDIENCE:-http://localhost:3000}
      JWT__ValidIssuer: ${JWT_VALID_ISSUER:-http://localhost:5152}
      JWT__Secret: ${JWT_SECRET:-JWTRefreshTokenHIGHsecuredPasswordVVVp1OH7Xzyr}
      JWT__TokenValidityInMinutes: ${JWT_TOKEN_VALIDITY_IN_MINUTES:-60}
      JWT__RefreshTokenValidityInDays: ${JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS:-7}
      GenAI__GrpcAddress: ${GENAI_GRPC_ADDRESS:-http://genai:50051}
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
      - azurite
      - servicebus
    volumes:
      - app-images:/app/wwwroot/Images
      - app-posts:/app/wwwroot/posts

  chat-functions:
    build:
      context: .
      dockerfile: Backend/SocialMediaWeb.ChatFunctions/Dockerfile
    restart: unless-stopped
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2lRcuQYhQv4o9VpxYlRvxK5Y6uR4oTHC9S0N2S/0EDYw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      ConnectionStrings__Con: Server=sqlserver,1433;Database=SocialMedia;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Change_this_password_123!};TrustServerCertificate=True;Encrypt=False;
      ServiceBusConnection: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ChatQueueName: chat-messages
      DurableTaskHubName: chatdelivery
    depends_on:
      - sqlserver
      - azurite
      - servicebus

  genai:
    profiles:
      - genai
    build:
      context: ./Backend/GenAI
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NIM_MODEL: ${NIM_MODEL:-}
      GENAI_GRPC_PORT: 50051
    expose:
      - "50051"

volumes:
  sqlserver-data:
  app-images:
  app-posts:
  azurite-data:
